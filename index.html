<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <title>Gestione Ordini Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/bottomNav.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="global-loader">
    <div class="spinner"></div>
  </div>

  <div id="update-toast" class="hidden">
    <span>Nuova versione disponibile!</span>
    <button id="refresh-btn" class="btn-primary btn-sm">Aggiorna</button>
  </div>

  <div id="progressContainer" class="progress-container hidden">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <main class="container">
    <div id="login-container">
      <h1 class="main-title">Accesso Riservato</h1>
      <div id="login-form" style="width:100%;">
        <div class="form-group">
          <input type="email" id="login-email" class="form-control" placeholder="Email">
        </div>
        <div class="password-wrapper">
          <input type="password" id="login-password" class="form-control" placeholder="Password">
          <span id="togglePassword" class="toggle-icon"></span>
        </div>
        <button id="loginBtn" class="btn-success">Accedi</button>
        <button id="installBtnLogin" class="btn-install btn-success hidden">Installa l'App</button>
      </div>
    </div>

    <div id="app-content" class="hidden">
      <div id="step" class="hidden">
        <header class="header">
          <h2 id="categoriaNome" class="main-title"></h2>
          <div class="nav-buttons" style="display:flex; gap:10px;">
            <button id="indietroBtn" class="btn-secondary btn-half"></button>
            <button id="avantiBtn"   class="btn-primary   btn-half"></button>
          </div>
        </header>
        <div id="prodottiContainer"></div>
      </div>

      <div id="order-complete" class="hidden">
        <h2 class="main-title">Ordine Completato</h2>
        <p style="text-align:center; color:var(--text-muted); margin-bottom:30px;">
          Hai completato tutte le categorie. Cosa vuoi fare?
        </p>
        <button id="backToCategoriesBtn" class="btn-secondary">Torna Indietro</button>
        <button id="goToSummaryBtn" class="btn-primary">Vai a Riepilogo</button>
      </div>

      <div id="order-summary" class="hidden">
        <h2 class="main-title">Riepilogo Ordine</h2>
        <div id="orderSummaryContent"></div>
        <div id="orderSummaryActions" class="hidden">
          <button id="copyOrderBtn" class="btn-info">Copia Messaggio</button>
          <button id="whatsappOrderBtn" class="btn-whatsapp">Apri WhatsApp</button>
          <button id="clearOrderBtn" class="btn-danger">Pulisci Ordine</button>
        </div>
      </div>

      <div id="profile" class="hidden"></div>
    </div>
  </main>

  <div id="bottom-nav" class="hidden"></div>

  <script src="js/pwa-install.js" defer></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
  </script>
</body>
</html>
